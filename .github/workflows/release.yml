# Release on a v* tag push: the shared workflow cross-builds, publishes the
# GitHub Release, and regenerates + pushes the Homebrew formula. To release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: shhac/homebrew-tap/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      name: agent-incident
      # Homebrew's desc audit requires a leading capital, so the brand cannot
      # come first — "Incident.io" would be wrong. The shared workflow enforces
      # this.
      desc: "Triage CLI for incident.io, built for AI agents"
      formula_class: AgentIncident
      help_match: "incident.io triage CLI"
